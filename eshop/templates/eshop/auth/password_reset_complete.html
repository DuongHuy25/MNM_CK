{% extends 'eshop/base.html' %}
{% block title %}Mật Khẩu Đã Đổi{% endblock %}
{% block content %}
<div style="max-width:440px;margin:3rem auto;">
    <div class="summary-card" style="padding:2.5rem;text-align:center;">
        <div style="width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#2dce89,#38f9d7);display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;">
            <i class="fas fa-check" style="font-size:1.5rem;color:white;"></i>
        </div>
        <h2 style="font-size:1.5rem;font-weight:800;color:#2d3436;margin-bottom:.5rem;">Mật Khẩu Đã Được Đổi!</h2>
        <p style="color:#636e72;font-size:.9rem;margin-bottom:1.5rem;">Bạn có thể đăng nhập bằng mật khẩu mới.</p>
        <a href="{% url 'eshop:login' %}" class="btn-primary" style="display:inline-block;">
            <i class="fas fa-sign-in-alt"></i> Đăng Nhập Ngay
        </a>
    </div>
</div>
{% endblock %}
